; User-adjustable comfort defaults. No headset comfort measurement has been performed.
[Comfort]
FollowStartDegrees=35
FollowStopDegrees=8
FollowDegreesPerSecond=90
PositionStartMeters=0.35
PositionStopMeters=0.10
PositionEaseSeconds=0.35
MenuDistanceMeters=2.2
MenuWidthMeters=2.2
HudDistanceMeters=1.5
HudWidthMeters=1.05

[Feedback]
FireStrength=0.35
DamageStrength=0.55

[Laser]
Enabled=1
MaxDistanceMeters=100

; Experimental sampled head-lean fade, disabled by default.
; Missing/mismatched native queries do not dim the world. This is not body collision.
[HeadComfort]
Enabled=0
RadiusMeters=0.12
FadeDepthMeters=0.05

; Optional per-weapon alignment. IDs are listed in docs/WEAPON_IDS.md.
; Positions are meters in the controller aim basis: X right, Y up, Z backward.
; Both gun-model placement and native muzzle retargeting share this offset.
[Weapon12]
OffsetX=0
OffsetY=0
OffsetZ=0
PitchDegrees=0
YawDegrees=0
RollDegrees=0

; Experimental native remote head bones. GPU and CPU palette paths are wired,
; but native concurrent-worker lifetime and appearance remain unverified.
[Multiplayer]
RemoteHeadTracking=0

[Scope]
; Optical presentation eye relief; native per-weapon zoom timing stays unchanged.
EyeReliefMeters=0.1
