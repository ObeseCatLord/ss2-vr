name: Offline source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-06
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public branch commit privacy
        if: github.event_name != 'pull_request'
        run: python3 tools/verify_publication_history.py HEAD
      - name: Configure portable helpers only
        run: >-
          cmake -S . -B build-offline -DSS2VR_COMPONENT=core
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DPython3_EXECUTABLE="$(command -v python3)"
      - name: Build portable helpers
        run: cmake --build build-offline --parallel 2
      - name: Require Python regressions in the test inventory
        run: |
          ctest --test-dir build-offline --show-only=json-v1 > /tmp/ss2vr-tests.json
          python3 - <<'PY'
          import json
          names = {test['name'] for test in json.load(open('/tmp/ss2vr-tests.json'))['tests']}
          required = {'publication_history_checks', 'scope_shader_embedding_checks',
                      'installer_checks', 'camera_abi_verifier_checks', 'assertion_checks'}
          assert required <= names, 'Required offline tests were not configured'
          PY
      - name: Run offline tests with assertions enabled
        run: ctest --test-dir build-offline --output-on-failure
